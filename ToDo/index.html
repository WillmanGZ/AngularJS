<!DOCTYPE html>
<html lang="en" ng-app="ToDoList">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hola ToDoList</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="./controller.js"></script>
  </head>
  <body ng-controller="ToDoController">
    <ul>
      <li ng-repeat="actividad in todo track by $index">
        <!-- El | es como los pipes, solo que aca se le llaman filtros -->
        {{actividad.descripcion}} - {{actividad.fecha | date: 'short'}}
      </li>
    </ul>

    <!-- Usamos ng submit para capturar el evento submit de un formulario y remplazarlo por una función que esté en el módulo -->
    <form ng-submit="addActv()">
      <input type="text" ng-model="newActv.descripcion" />
      <input type="datetime-local" ng-model="newActv.fecha" />
      <input type="submit" value="Guardar Actividad" />
    </form>

    <button ng-click="clean()">Limpiar</button>
  </body>
</html>
